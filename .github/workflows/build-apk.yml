name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK using Buildozer Docker
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -e BUILDOZER_WARN_ON_ROOT=0 \
            -v ${{ github.workspace }}:/home/buildozer \
            -w /home/buildozer \
            kivy/buildozer:latest \
            -c '
              SDK="/root/.buildozer/android/platform/android-sdk"
              SDKMANAGER=$(find "$SDK" -name sdkmanager -type f | head -1)

              echo "sdkmanager: $SDKMANAGER"

              yes | "$SDKMANAGER" --licenses

              "$SDKMANAGER" "build-tools;37.0.0"

              echo "Checking aidl..."
              ls -l "$SDK/build-tools/37.0.0/aidl"

              buildozer android debug
            '

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
